<div class="parent">
    <div class="child">
        <div class="header">
            <h2>Add Category</h2>
            <div class="divider"></div>
        </div>

        <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()">
            <div class="form-content">
                <div class="profile-section">
                    <div class="profile-container">
                        <label for="upload_profile_image" class="upload-label">
                            <div class="profile-preview">
                                <img class="profile" [src]="imagePreview || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgdmlld0JveD0iMCAwIDEyMCAxMjAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIiByeD0iNjAiIGZpbGw9IiNGNEY0RjQiLz4KPHBhdGggZD0iTTYwIDM1QzY4LjI4NDMgMzUgNzUgNDEuNzE1NyA3NSA1MEM3NSA1OC4yODQzIDY4LjI4NDMgNjUgNjAgNjVDNTEuNzE1NyA2NSA0NSA1OC4yODQzIDQ1IDUwQzQ1IDQxLjcxNTcgNTEuNzE1NyAzNSA2MCAzNVoiIGZpbGw9IiNEQURBREQiLz4KPHBhdGggZD0iTTQ1IDg1QzQ1IDc1IDUxIDcwIDYwIDcwQzY5IDcwIDc1IDc1IDc1IDg1SDQ1WiIgZmlsbD0iI0RBRUFERSIvPgo8L3N2Zz4K'" alt="" />
                                <div class="upload-overlay">
                                    <i class="upload-icon">📷</i>
                                </div>
                            </div>
                        </label>
                        <input type="file" id="upload_profile_image" accept="image/x-png,image/gif,image/jpeg" (change)="onFileSelected($event)">
                    </div>
                </div>

                <div class="form-group">
                    <nz-form-item>
                        <nz-form-control nzHasFeedback [nzXs]="24" nzErrorTip="This Input Is Required!">
                            <input nz-input placeholder="Category Name" formControlName="name" class="custom-input" />
                        </nz-form-control>
                    </nz-form-item>
                </div>

                <div class="form-group">
                    <nz-form-item>
                        <nz-form-control nzHasFeedback [nzXs]="24" nzErrorTip="This Input Is Required!">
                            <textarea rows="2" nz-input placeholder="Description" formControlName="description" class="custom-textarea"></textarea>
                        </nz-form-control>
                    </nz-form-item>
                </div>
            </div>

            <button nz-button class="submit-button" [nzType]="'primary'">
                <span class="button-text">Add Category</span>
                <div class="button-loader"></div>
            </button>
        </form>
    </div>
</div>
