<div class="login-bg">
  <div class="particles"></div>
  
  <nz-spin [nzSpinning]="isSpinning" [nzSize]="'large'" nzTip="Working...">
    <div class="login-container">
      <div class="login-card">

        <!-- LOGO -->
        <div class="logo-container">
          <div class="led-ring">
            <div class="led-segment"></div>
            <div class="led-segment"></div>
            <div class="led-segment"></div>
            <div class="led-segment"></div>
            <div class="led-segment"></div>
            <div class="led-segment"></div>
            <div class="led-segment"></div>
            <div class="led-segment"></div>
          </div>
          <div class="login-logo">
            <img src="/assets/logo3.png" alt="Nobu Malibu" />
          </div>
        </div>

        <div class="login-header">
          <h2>Welcome Back</h2>
          <p>Please log in to your account</p>
        </div>

        <!-- ERROR -->
        <div *ngIf="errorMessage" class="error-message" [class.show]="errorMessage">
          <div class="error-icon">⚠️</div>
          <div class="error-text">{{ errorMessage }}</div>
          <div class="error-close" (click)="clearError()">×</div>
        </div>

        <!-- FORM -->
        <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()">

          <nz-form-item>
            <nz-form-control nzErrorTip="Please input your email!">
              <nz-input-group nzPrefixIcon="mail" [class.error]="hasError">
                <input
                  type="text"
                  nz-input
                  formControlName="username"
                  placeholder="Email"
                  [class.error]="hasError"
                  (input)="onInputChange()"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzErrorTip="Please input your password!">
              <nz-input-group nzPrefixIcon="lock" [class.error]="hasError">
                <input
                  type="password"
                  nz-input
                  formControlName="password"
                  placeholder="Password"
                  [class.error]="hasError"
                  (input)="onInputChange()"
                />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>

          <div class="login-options">
            <label nz-checkbox formControlName="remember">Remember me</label>
            <a class="forgot" routerLink="/forgot-password">Forgot password?</a>
          </div>

          <button
            nz-button
            [nzType]="'primary'"
            class="login-btn"
            [disabled]="validateForm.invalid"
          >
            Log in
          </button>

          <!-- 🔥 BOTÓN GOOGLE (AQUÍ ESTÁ LA CLAVE) -->
          <div class="google-login-container">
            <p class="divider">or</p>
            <div id="googleBtn"></div>
          </div>

          <div class="login-footer">
            Or <a routerLink="/register">register now</a>
          </div>

        </form>
      </div>
    </div>
  </nz-spin>

  <!-- INFO BOX -->
  <div class="login-info-box">
    <img
      src="/assets/NobuMalibu1.jpg"
      alt="Restaurant"
      class="restaurant-photo"
    />
    <p class="restaurant-address">
      <a
        href="https://www.google.com/maps?q=22706+Pacific+Coast+Hwy,+Malibu,+CA+90265,+Estados+Unidos"
        target="_blank"
      >
       Pacific Coast Hwy, Nobu Malibu, CA 90265, Estados Unidos
      </a>
    </p>
  </div>
</div>
